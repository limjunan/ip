plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

// JavaFX ships one native-library JAR per OS/architecture (win, mac,
// mac-aarch64, linux, ...). Depending on all of them at once (as the
// SE-EDU tutorial's plain example does) makes them collide at runtime:
// their native libraries share resource paths, and JavaFX's extractor
// can end up unpacking the wrong OS/arch's binary, e.g. an x86_64
// .dylib on Apple Silicon. So only the classifier matching the machine
// actually running the build is depended on here.
String osName = System.getProperty("os.name").toLowerCase()
String osArch = System.getProperty("os.arch").toLowerCase()
String javaFxClassifier
if (osName.contains("win")) {
    javaFxClassifier = "win"
} else if (osName.contains("mac")) {
    javaFxClassifier = osArch.contains("aarch64") ? "mac-aarch64" : "mac"
} else {
    javaFxClassifier = osArch.contains("aarch64") ? "linux-aarch64" : "linux"
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '25.0.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'

    implementation "org.openjfx:javafx-base:${javaFxVersion}:${javaFxClassifier}"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:${javaFxClassifier}"
    implementation "org.openjfx:javafx-fxml:${javaFxVersion}:${javaFxClassifier}"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:${javaFxClassifier}"
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'jeryl.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'jeryl.jar'
}

run {
    standardInput = System.in
}
